<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bat Ball Stump Game</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      background: linear-gradient(135deg,#0f172a,#1e293b,#334155);
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      padding:20px;
    }

    .game-container{
      width:100%;
      max-width:800px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border-radius:25px;
      padding:30px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    h1{
      font-size:3rem;
      margin-bottom:10px;
      color:#facc15;
    }

    .subtitle{
      margin-bottom:30px;
      color:#cbd5e1;
    }

    .choices{
      display:flex;
      justify-content:center;
      gap:25px;
      flex-wrap:wrap;
      margin-bottom:30px;
    }

    .choice-button{
      width:170px;
      height:170px;
      border:none;
      border-radius:20px;
      overflow:hidden;
      cursor:pointer;
      transition:0.3s;
      background:#fff;
      position:relative;
    }

    .choice-button:hover{
      transform:translateY(-10px) scale(1.05);
      box-shadow:0 15px 25px rgba(0,0,0,0.4);
    }

    .choice-image{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .choice-name{
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      background:rgba(0,0,0,0.7);
      color:white;
      padding:8px;
      font-size:18px;
      font-weight:bold;
    }

    .result-box{
      background: rgba(255,255,255,0.1);
      border-radius:20px;
      padding:20px;
      margin-top:20px;
    }

    .moves{
      display:flex;
      justify-content:space-around;
      flex-wrap:wrap;
      gap:20px;
      margin-bottom:20px;
    }

    .move-card{
      background:rgba(255,255,255,0.08);
      padding:15px;
      border-radius:15px;
      width:220px;
    }

    .move-card h3{
      margin-bottom:10px;
      color:#facc15;
    }

    .result{
      font-size:2rem;
      margin:15px 0;
      font-weight:bold;
    }

    .win{
      color:#22c55e;
    }

    .lose{
      color:#ef4444;
    }

    .tie{
      color:#38bdf8;
    }

    .score-board{
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:20px;
      flex-wrap:wrap;
    }

    .score-card{
      background:rgba(255,255,255,0.08);
      padding:15px 25px;
      border-radius:15px;
      min-width:120px;
    }

    .score-card h2{
      font-size:2rem;
      margin-bottom:5px;
    }

    .reset-btn{
      margin-top:30px;
      padding:12px 30px;
      border:none;
      border-radius:12px;
      background:#ef4444;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    .reset-btn:hover{
      background:#dc2626;
      transform:scale(1.05);
    }

    @media(max-width:600px){
      h1{
        font-size:2rem;
      }

      .choice-button{
        width:130px;
        height:130px;
      }
    }
  </style>
</head>

<body>

  <div class="game-container">

    <h1>🏏 Bat Ball Stump</h1>
    <p class="subtitle">Play against the computer</p>

    <div class="choices">

      <button class="choice-button" onclick="playGame('Bat')">
        <img src="bat.jpeg" class="choice-image">
        <div class="choice-name">Bat</div>
      </button>

      <button class="choice-button" onclick="playGame('Ball')">
        <img src="ball.jpeg" class="choice-image">
        <div class="choice-name">Ball</div>
      </button>

      <button class="choice-button" onclick="playGame('Stump')">
        <img src="wicket.jpeg" class="choice-image">
        <div class="choice-name">Stump</div>
      </button>

    </div>

    <div class="result-box">

      <div class="moves">

        <div class="move-card">
          <h3>You Chose</h3>
          <p id="user-move">-</p>
        </div>

        <div class="move-card">
          <h3>Computer Chose</h3>
          <p id="computer-move">-</p>
        </div>

      </div>

      <div id="result" class="result">Start Playing!</div>

      <div class="score-board">

        <div class="score-card">
          <h2 id="wins">0</h2>
          <p>Wins</p>
        </div>

        <div class="score-card">
          <h2 id="losses">0</h2>
          <p>Losses</p>
        </div>

        <div class="score-card">
          <h2 id="ties">0</h2>
          <p>Ties</p>
        </div>

      </div>

    </div>

    <button class="reset-btn" onclick="resetGame()">
      Reset Game
    </button>

  </div>

  <script>

    let score = JSON.parse(localStorage.getItem('score')) || {
      win:0,
      lost:0,
      tie:0
    };

    updateScore();

    function playGame(userMove){

      const computerMove = generateComputerChoice();

      let result = '';

      if(userMove === computerMove){
        score.tie++;
        result = "It's a Tie 🤝";
      }

      else if(
        (userMove === 'Bat' && computerMove === 'Ball') ||
        (userMove === 'Ball' && computerMove === 'Stump') ||
        (userMove === 'Stump' && computerMove === 'Bat')
      ){
        score.win++;
        result = 'You Won 🎉';
      }

      else{
        score.lost++;
        result = 'Computer Won 😢';
      }

      localStorage.setItem('score', JSON.stringify(score));

      document.getElementById('user-move').innerText = userMove;
      document.getElementById('computer-move').innerText = computerMove;

      const resultElement = document.getElementById('result');

      resultElement.innerText = result;

      resultElement.classList.remove('win','lose','tie');

      if(result.includes('Won')){
        resultElement.classList.add('win');
      }
      else if(result.includes('Tie')){
        resultElement.classList.add('tie');
      }
      else{
        resultElement.classList.add('lose');
      }

      updateScore();
    }

    function generateComputerChoice(){

      const choices = ['Bat','Ball','Stump'];

      const randomIndex = Math.floor(Math.random() * 3);

      return choices[randomIndex];
    }

    function updateScore(){

      document.getElementById('wins').innerText = score.win;
      document.getElementById('losses').innerText = score.lost;
      document.getElementById('ties').innerText = score.tie;
    }

    function resetGame(){

      score = {
        win:0,
        lost:0,
        tie:0
      };

      localStorage.clear();

      updateScore();

      document.getElementById('user-move').innerText = '-';
      document.getElementById('computer-move').innerText = '-';
      document.getElementById('result').innerText = 'Start Playing!';
    }

  </script>

</body>
</html>
